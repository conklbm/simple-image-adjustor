<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Image Adjustor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Simple Image Adjustor</h1>
            <p>Prepare your images for Facebook with easy editing tools</p>
        </header>

        <div class="main-content">
            <!-- Upload Section -->
            <section class="upload-section">
                <div class="upload-box">
                    <input type="file" id="imageInput" accept="image/*">
                    <label for="imageInput" class="upload-label">
                        <span class="upload-icon">📁</span>
                        <span>Click to upload image</span>
                    </label>
                </div>
            </section>

            <!-- Editor Section -->
            <section class="editor-section" id="editorSection" style="display: none;">
                <div class="canvas-container">
                    <canvas id="canvas"></canvas>
                    <div id="cropOverlay" class="crop-overlay" style="display: none;">
                        <div id="cropBox" class="crop-box">
                            <div class="crop-handle nw"></div>
                            <div class="crop-handle ne"></div>
                            <div class="crop-handle sw"></div>
                            <div class="crop-handle se"></div>
                        </div>
                    </div>
                </div>

                <!-- Controls Panel -->
                <div class="controls-panel">
                    <!-- Crop Controls -->
                    <div class="control-group">
                        <h3>Crop</h3>
                        <button id="enableCropBtn" class="btn btn-secondary">Enable Crop Selection</button>
                        <button id="applyCropBtn" class="btn btn-primary" style="display: none;">Apply Crop</button>
                        <button id="cancelCropBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
                    </div>

                    <!-- Color Enhancement -->
                    <div class="control-group">
                        <h3>Color Enhancement</h3>
                        <label for="colorEnhancement">
                            Enhancement Level: <span id="colorValue">1.3</span>x
                        </label>
                        <input type="range" id="colorEnhancement" min="0.5" max="2.0" step="0.1" value="1.3">
                    </div>

                    <!-- Rotation -->
                    <div class="control-group">
                        <h3>Rotation</h3>
                        <label for="rotationAngle">
                            Angle: <span id="rotationValue">0.5</span>°
                        </label>
                        <input type="range" id="rotationAngle" min="-5" max="5" step="0.1" value="0.5">
                    </div>

                    <!-- Facebook Size -->
                    <div class="control-group">
                        <h3>Facebook Size</h3>
                        <select id="facebookSize" class="select-box">
                            <option value="square">1080 x 1080 (Square)</option>
                            <option value="portrait">1080 x 1350 (Portrait)</option>
                            <option value="landscape">1080 x 566 (Landscape)</option>
                        </select>
                    </div>

                    <!-- Watermark -->
                    <div class="control-group">
                        <h3>Watermark (Optional)</h3>
                        <input type="file" id="watermarkInput" accept="image/*" style="display: none;">
                        <label for="watermarkInput" class="btn btn-secondary">
                            Upload Watermark
                        </label>
                        <span id="watermarkName"></span>
                        <button id="removeWatermarkBtn" class="btn btn-small" style="display: none;">Remove</button>

                        <div id="watermarkControls" style="display: none; margin-top: 10px;">
                            <label for="watermarkOpacity">
                                Opacity: <span id="opacityValue">50</span>%
                            </label>
                            <input type="range" id="watermarkOpacity" min="0" max="100" step="5" value="50">

                            <label for="watermarkPosition">Position:</label>
                            <select id="watermarkPosition" class="select-box">
                                <option value="bottom-right">Bottom Right</option>
                                <option value="bottom-left">Bottom Left</option>
                                <option value="top-right">Top Right</option>
                                <option value="top-left">Top Left</option>
                                <option value="center">Center</option>
                            </select>

                            <label for="watermarkSize">
                                Size: <span id="watermarkSizeValue">20</span>%
                            </label>
                            <input type="range" id="watermarkSize" min="5" max="50" step="5" value="20">
                        </div>
                    </div>

                    <!-- Preview and Download -->
                    <div class="control-group">
                        <button id="previewBtn" class="btn btn-primary">Preview Changes</button>
                        <button id="downloadBtn" class="btn btn-success">Download Image</button>
                        <button id="resetBtn" class="btn btn-secondary">Reset to Original</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
